<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: red;
            transition: width 2s, height 3s, background-color 4s;
        }
        .box:hover{
            width: 300px;
            height: 300px;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>
        Hover CSS - Áp dụng các thuộc tính CSS khi
        hover (hover - sự kiện khi di chuyển vào khối đó) 
    </h1>
    <div class="box"></div>
</body>
</html>
