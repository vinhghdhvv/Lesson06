<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a{
            width: 120px;
            height: 50px;
            background-color: yellow;
            transform: rotate(20deg);
        }
    </style>
    <style>
        .b{
            width: 120px;
            height: 50px;
            background-color: yellow;
            transform: skewY(20deg);
        }
    </style>
    <style>
        .c{
            width: 120px;
            height: 50px;
            background-color: yellow;
            transform: scale(1.5);
        }
    </style>    
    <style>
         .d{
            width: 120px;
            height: 50px;
            background-color: yellow;
            transform: translateX(100%);
        }
    </style>
</head>
<body>
    <h2>transform: rotate(20deg)</h2>
    <div class="a">Rotate - Xoay</div>
    <h2>transform: skewY(20deg)</h2>
    <div class="b">Skew - Nghiêng</div>
    <h2>transform: scale(1.5)</h2>
    <div class="c">Scale - Phóng to</div>
    <h2>transform: translateX(100%)</h2>
    <div class="d">Translate - Di chuyển</div>
</body>
</html>
